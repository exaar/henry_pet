name: henry_pet
version: 0.3.0
description: "Henry desktop cat: posts Hermes agent state (thinking / working / waiting / done / failed) to henry_pet's local API so her mood follows live sessions."
author: exaar
license: MIT
homepage: https://github.com/exaar/henry_pet
provides_hooks:
  - pre_llm_call
  - on_stream_start
  - pre_tool_call
  - post_tool_call
  - on_human_input_request
  - on_human_input_resolved
  - on_session_end
